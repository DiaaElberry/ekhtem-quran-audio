# Imports recitation sets from their source straight into this repository and Cloudflare R2, so the audio never passes
# through a PC. Run by hand only: Actions -> Import recitation sets -> Run workflow. One job per set.
#
#   prepare  download the set from its source, check every file against the timing release it was aligned to, build the
#            app's manifest and ayah timings, and check the timings against the decoded audio. Publishes nothing: the
#            results come back as an artifact per set, to be reviewed and committed in the app repository.
#   publish  download the set again, check every file's size and sha256 against the committed manifest
#            (import/content/recitations/<set>/audio_manifest.json), create the release <set> (never an existing one),
#            copy it to R2 and check it on the public address (mirror/files.json must list it: audio_mirror.py export).
#   measure  (one set) fetch the surahs the windows name, check them against the committed manifest, and time those ayat by
#            speech recognition in the set's own files (tools/time_surahs_by_speech.py, faster-whisper small on the CPU).
#            The measured_timings.json comes back as an artifact, to be committed in both repositories before prepare runs
#            again (decision 258, 18 Nov 2026: the audio stays off the PC, as for the import itself).
#   facts    download the set and describe its audio only: each file's frame walk (size, sha256, length, format) and its
#            envelopes, as an artifact; no timing is fetched or read. For a set whose timing data may not be published
#            (QUD v5, QUA Dataset License 1.0: "privateTimings"), which is built and checked off GitHub from these facts
#            (decision 270, 19 Nov 2026). The tools refuse to build such a set's timings on a GitHub machine.
#
# import/ holds copies of the app repository's tools/prepare_recitation_set.py, tools/check_recitation_audio.py,
# tools/publish_recitation_set.py, tools/time_surahs_by_speech.py, tools/fetch_measure_audio.py and the two text files
# they read, at the same paths.
name: Import recitation sets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare: build and check, publish nothing. publish: release and copy to R2. measure: time the windows by speech (one set). facts: describe the audio only (private timings)."
        type: choice
        options: [prepare, publish, measure, facts]
        default: prepare
      sets:
        description: "Comma-separated set ids, for example sudais-hafs-v1,ghamdi-hafs-v1"
        type: string
        required: true
      windows:
        description: "measure only: space-separated SURAH:FIRST-LAST@FROMMS-TOMS, for example 9:102-104@2390198-2448210"
        type: string
        required: false
        default: ""
      channel:
        description: "measure only: the channel recognized, mix (default) or left/right for a file with one channel inverted"
        type: choice
        options: [mix, left, right]
        default: mix

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sets: ${{ steps.list.outputs.sets }}
    steps:
      - id: list
        env:
          SETS: ${{ inputs.sets }}
        run: python3 -c 'import json, os; print("sets=" + json.dumps([s.strip() for s in os.environ["SETS"].split(",") if s.strip()]))' >> "$GITHUB_OUTPUT"

  set:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        set: ${{ fromJSON(needs.plan.outputs.sets) }}
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v7

      # faster-whisper's ctranslate2 wheels need a Python they are built for; the runner's own python3 may be newer.
      - name: Python for the speech tools
        if: inputs.mode == 'measure'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy miniaudio "boto3>=1.36"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Prepare (download, build, check)
        if: inputs.mode == 'prepare'
        run: |
          python -I -X utf8 import/tools/prepare_recitation_set.py --set "$SET" --download --staging "$RUNNER_TEMP/staging"
          python -I -X utf8 import/tools/check_recitation_audio.py --set "$SET" --staging "$RUNNER_TEMP/staging"
          cp -r "$RUNNER_TEMP/staging/fetch-log" "import/content/recitations/$SET/fetch-log"

      - name: Keep the results
        if: inputs.mode == 'prepare' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.set }}
          path: import/content/recitations/${{ matrix.set }}/
          if-no-files-found: warn

      - name: Facts (download, describe the audio only; no timing is fetched or read)
        if: inputs.mode == 'facts'
        run: |
          python -I -X utf8 import/tools/prepare_recitation_set.py --set "$SET" --download --facts-only --staging "$RUNNER_TEMP/staging"
          python -I -X utf8 import/tools/check_recitation_audio.py --set "$SET" --staging "$RUNNER_TEMP/staging" --envelopes-only
          mkdir -p "$RUNNER_TEMP/facts"
          cp -r "$RUNNER_TEMP/staging/audio-facts" "$RUNNER_TEMP/staging/analysis" "$RUNNER_TEMP/staging/fetch-log" "$RUNNER_TEMP/facts/"

      - name: Keep the facts
        if: inputs.mode == 'facts' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.set }}-facts
          path: ${{ runner.temp }}/facts/
          if-no-files-found: warn

      - name: Measure (fetch and check the windows' files, time them by speech)
        if: inputs.mode == 'measure'
        env:
          WINDOWS: ${{ inputs.windows }}
          CHANNEL: ${{ inputs.channel }}
          AUDIO: ${{ runner.temp }}/audio
        run: |
          pip install --quiet "faster-whisper>=1.1,<2"
          python -I -X utf8 import/tools/fetch_measure_audio.py
          ARGS=()
          for w in $WINDOWS; do ARGS+=(--window "$w"); done
          python -I -X utf8 import/tools/time_surahs_by_speech.py --set "$SET" --audio "$AUDIO" --channel "${CHANNEL:-mix}" "${ARGS[@]}"

      - name: Keep the measurement
        if: inputs.mode == 'measure' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.set }}-measured
          path: import/content/recitations/${{ matrix.set }}/measured_timings.json
          if-no-files-found: warn

      - name: Release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -X utf8 import/tools/publish_recitation_set.py --set "$SET" --staging "$RUNNER_TEMP/staging"

      - name: Copy to R2
        if: inputs.mode == 'publish'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python mirror/audio_mirror.py copy --list mirror/files.json --only "$SET/"

      - name: Check the public address
        if: inputs.mode == 'publish'
        run: python mirror/audio_mirror.py verify --list mirror/files.json --only "$SET/" --full-hash
